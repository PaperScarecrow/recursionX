[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "recursionx"
version = "0.1.0"
description = "Recursion-X: looped liquid-hybrid MoE transformer with wake/sleep continual learning"
requires-python = ">=3.10"
dependencies = ["torch>=2.4", "numpy"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib"]

[tool.setuptools.packages.find]
include = ["recursionx*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
